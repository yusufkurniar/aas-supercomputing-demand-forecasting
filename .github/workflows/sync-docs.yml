name: Sync report to docs

on:
  push:
    branches: [main]
    paths:
      - "report/report.html"
      - "report/report.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update docs
        run: |
          cp report/report.html docs/index.html
          cp report/report.pdf docs/report.pdf

      - name: Commit and push updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/report.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Automatically sync published report"
            git push
          fi
